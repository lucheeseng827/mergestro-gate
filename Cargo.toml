[workspace]

[package]
name = "mergestro-gate"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Slop Filter — behavioral merge gate (Phase 4: blocking differential mutation gate for Rust, with severity ranking, a debt-delta budget, validation telemetry and a trend dashboard)"

[lib]
name = "slop_filter"
path = "src/lib.rs"

[[bin]]
name = "slop-gate"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1.0"
anyhow = "1.0"
tempfile = "3.10"
# Phase 2: pure-Rust diff against the base ref (no `git` subprocess).
gix = { version = "0.83", default-features = false, features = ["blob-diff", "revision", "max-performance-safe", "sha1"] }
# Phase 2: lightweight, synchronous GitHub REST client for PR comments.
# >= 2.12 ensures a patched rustls (>= 0.23.18, RUSTSEC-2024-0399).
ureq = { version = "2.12", features = ["json", "tls"] }
# Pattern lane (slop signatures): parse changed Rust to an AST. `span-locations`
# gives source line numbers so findings can be scoped to the diff's added lines.
syn = { version = "2", features = ["full", "visit", "parsing"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
quote = "1"
# Security pattern lane: line-oriented anti-pattern rules over added lines.
regex = "1"
# JVM engine (Java/Kotlin via PIT): parse PIT's mutations.xml report.
roxmltree = "0.20"
