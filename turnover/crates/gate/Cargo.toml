# Explicit fields, no `workspace = true` inheritance: these crates are vendored verbatim into
# the Mergestro gate's OSS mirror as path dependencies, and cargo resolves inheritance against
# whichever workspace root it finds ABOVE the vendored copy — not this module's. Explicit
# fields build the same everywhere. Versions are pinned once in the root Cargo.toml comment.
[package]
name = "turnover-gate"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/lucheeseng827/mergestro-gate"
rust-version = "1.82"
description = "The turnover gate as a library: baseline on disk, window selection, policy evaluation, reports and the Mergestro record — what the CLI and the Mergestro gate lane both call."

[dependencies]
turnover-core = { path = "../core", version = "0.1.0" }
turnover-history = { path = "../history", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
anyhow = "1"
# The baseline-service client: small, synchronous, bounded timeouts. >= 2.12 pins a patched
# rustls (RUSTSEC-2024-0399), matching the Mergestro gate's own HTTP client.
ureq = { version = "2.12", features = ["tls"] }
gix = { version = "0.87", default-features = false, features = ["max-performance-safe", "blob-diff", "revision", "parallel", "sha1"] }
thiserror = "2"

[dev-dependencies]
tempfile = "3"
