# GitLab CI — behavioral merge gate, plane telemetry, and an MR comment.
#
# Copy into your repo's `.gitlab-ci.yml` (or `include:` it). Runs on merge
# request pipelines. The image (mancube/mergestro-gate) bakes in the Rust
# toolchain + cargo-mutants, so the gate runs with zero setup — no rustup step.
#
# ── Why this file has two jobs ───────────────────────────────────────────────
#
# The gate's own `--comment` flag speaks GitHub Actions and only GitHub Actions:
# it reads GITHUB_TOKEN / GITHUB_REPOSITORY / GITHUB_REF, none of which exist
# here. Until the plane can post to a forge itself (see
# `ee/mergestro/docs/forge-chatops.md`), the MR comment on GitLab is CI-side
# glue — and this is that glue, kept honest:
#
#   1. `behavioral-gate` runs the gate, emits the SAME markdown the GitHub
#      comment uses (`--format markdown`), and uploads it as an artifact.
#   2. `gate-comment` posts or updates one sticky note on the MR, found by the
#      gate's own marker so re-runs edit in place instead of stacking.
#
# The split is not stylistic: the gate image is Alpine running as uid 65532 with
# no curl and no jq, so `apk add` inside it fails. The posting job uses a plain
# alpine image that can install both.
#
# ── Variables to set (Settings → CI/CD → Variables) ──────────────────────────
#
#   MERGESTRO_INGEST_URL   variable, e.g. https://plane.example.com/v1/ingest
#                          Must be https:// — config validation refuses plaintext
#                          because the request carries the bearer below.
#   METRICS_TOKEN          masked secret — the plane's per-tenant ingest key.
#   MERGESTRO_GITLAB_TOKEN masked secret — a project or group access token with
#                          `api` scope, used ONLY to post the note. CI_JOB_TOKEN
#                          cannot write MR notes, which is why this exists.
#
# Omit the first two and the gate still gates; it just reports nowhere. Omit the
# third and you get the CI log only.
#
# ── Rollout ──────────────────────────────────────────────────────────────────
#
# Start advisory (`allow_failure: true` below) for ~a dozen MRs, confirm the
# survivors are real, then make it blocking by removing allow_failure.

stages:
  - gate
  - report

variables:
  # The gate writes this marker into its markdown so re-runs can find their own
  # note. It is `report::COMMENT_MARKER` in the gate's source — if you change it
  # here, the comment job stops recognising its previous comment and stacks.
  MERGESTRO_MARKER: "<!-- slop-gate:report -->"

behavioral-gate:
  stage: gate
  image:
    # Pin to a release tag. `:0.5` tracks the current minor; `:latest` moves
    # under you, which is the wrong trade for something that can block a merge.
    name: mancube/mergestro-gate:0.5
    # Reset the entrypoint so GitLab can run the script below in a shell
    # (the image's Alpine base provides /bin/sh). slop-gate is on PATH.
    entrypoint: [""]
  # Only on merge request pipelines (where a target branch exists to diff).
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  variables:
    # Full history so the merge-base against the target branch resolves
    # (GitLab shallow-clones by default).
    GIT_DEPTH: "0"
  script:
    # Make the target branch available locally for the diff.
    - git fetch origin "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME"
    - |
      # The gate's exit code IS the verdict (0 pass, 2 blocked, 1 operational
      # failure), so it must survive to the end of the job — but the report has
      # to be written and uploaded even on a block, which is the whole point of
      # commenting. Capture, then re-raise.
      set +e
      slop-gate \
        --repo . \
        --base "origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME" \
        --max-survivors 0 \
        --max-per-function 5 \
        --jobs 4 \
        --format markdown \
        --metrics-url "$MERGESTRO_INGEST_URL" \
        > mergestro-report.md
        # --advisory                      # report without blocking
        # --block-on-zero-assertion       # also gate assertion-free tests
        # --block-on-pattern security     # gate the security lane too
      GATE_RC=$?
      set -e
      # `--format markdown` sends the report to stdout, so the redirect above
      # empties the job log. Put it back — the log is what someone reads when
      # the comment job is the thing that broke.
      cat mergestro-report.md
      exit $GATE_RC
  artifacts:
    # `when: always` is load-bearing: a BLOCKED run is exactly the run whose
    # report must reach the MR, and a failed job uploads nothing by default.
    when: always
    expire_in: 1 week
    paths:
      - mergestro-report.md
  # Advisory rollout: keep this while you validate, then remove to block merges.
  allow_failure: true

gate-comment:
  stage: report
  image: alpine:3
  # Runs whatever the gate decided — see the artifact note above.
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: always
  needs:
    - job: behavioral-gate
      artifacts: true
  # A token hiccup must never change a verdict. The gate's own comment path is
  # best-effort by contract; this one matches that, and `allow_failure` is how
  # you say so in GitLab.
  allow_failure: true
  before_script:
    - apk add --no-cache curl jq
  script:
    - |
      if [ -z "${MERGESTRO_GITLAB_TOKEN:-}" ]; then
        echo "MERGESTRO_GITLAB_TOKEN is not set — skipping the MR comment."
        exit 0
      fi
      if [ ! -s mergestro-report.md ]; then
        echo "no report artifact — the gate job did not get far enough to write one."
        exit 0
      fi

      API="$CI_API_V4_URL/projects/$CI_PROJECT_ID/merge_requests/$CI_MERGE_REQUEST_IID/notes"
      AUTH="PRIVATE-TOKEN: $MERGESTRO_GITLAB_TOKEN"

      # Find our own previous note by the gate's marker. `// empty` so a clean
      # MR yields an empty string rather than the literal "null".
      EXISTING=$(curl -sS --fail-with-body --header "$AUTH" "$API?per_page=100" \
        | jq -r --arg m "$MERGESTRO_MARKER" \
            'map(select(.body | contains($m))) | first | .id // empty')

      if [ -n "$EXISTING" ]; then
        echo "updating note $EXISTING"
        curl -sS --fail-with-body --request PUT --header "$AUTH" \
          --data-urlencode "body@mergestro-report.md" \
          "$API/$EXISTING" > /dev/null
      else
        echo "posting a new note"
        curl -sS --fail-with-body --request POST --header "$AUTH" \
          --data-urlencode "body@mergestro-report.md" \
          "$API" > /dev/null
      fi
      echo "done"
