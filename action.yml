name: "Mergestro Gate"
description: "Behavioral merge gate for AI-generated code: mutation-tests your PR diff to catch lines your tests don't really cover."
author: "lucheeseng827"
branding:
  icon: "filter"
  color: "purple"

inputs:
  base-ref:
    description: "Base branch to diff against. Defaults to the PR's base branch."
    required: false
    default: ""
  config:
    description: "Path to a slop-gate YAML config file."
    required: false
    default: ""
  jobs:
    description: "Parallel mutant jobs."
    required: false
    default: "4"
  timeout:
    description: "Per-mutant test timeout, in seconds."
    required: false
    default: "60"
  max-per-function:
    description: "Hard cap on mutants tested per function."
    required: false
    default: "5"
  test-tool:
    description: >-
      Test runner cargo-mutants drives: `cargo` (default) or `nextest`
      (per-process, highly parallel — often 2-3x faster; needs cargo-nextest).
    required: false
    default: ""
  test-changed-package-only:
    description: >-
      Kept for compatibility. Since 0.6.0 each mutant runs only the changed
      crate's tests by default, so this input no longer changes anything; use
      `test-workspace` to widen.
    required: false
    default: "false"
  test-workspace:
    description: >-
      Run the whole workspace's tests against each mutant, not only the changed
      crate's. Slower; use it when a crate is tested mainly from another crate.
    required: false
    default: "false"
  budget:
    description: >-
      Wall-clock limit on the Rust mutation run, e.g. `10m`, `600`, `90s`.
      Mutants still running when it is reached are reported as not tested
      (never as caught or surviving). Empty = no limit.
    required: false
    default: ""
  block-on-budget:
    description: >-
      Block when the budget left mutants untested. By default that is a
      warning in the report.
    required: false
    default: "false"
  sarif:
    description: >-
      Also write the findings (survivors, zero-assertion tests, pattern lanes)
      as SARIF 2.1.0 to this path, e.g. `mergestro.sarif`. Empty = off.
    required: false
    default: ""
  upload-sarif:
    description: >-
      Upload the `sarif` file to GitHub code scanning, so findings show on the
      lines they are about. Needs `security-events: write` on the job. Runs
      even when the gate blocks.
    required: false
    default: "false"
  in-place:
    description: >-
      Mutate the checkout instead of a scratch copy, so mutants reuse the
      pre-flight's build (and a cached target/, e.g. Swatinem/rust-cache)
      instead of paying a second cold build. Mutants then run one at a time
      (`jobs` is ignored). Safe on a CI checkout.
    required: false
    default: "false"
  max-survivors:
    description: "Survivors tolerated before blocking (0 = any survivor blocks)."
    required: false
    default: "0"
  advisory:
    description: "Report but never block (Phase 1 behaviour)."
    required: false
    default: "false"
  block-on-zero-assertion:
    description: "Also block when assertion-free tests are found."
    required: false
    default: "false"
  block-on-severity:
    description: "Block when a survivor reaches this tier (low|medium|high|critical). Phase 4."
    required: false
    default: ""
  debt-budget:
    description: "Per-PR structural-debt budget (net complexity + duplication + coupling). Phase 4."
    required: false
    default: ""
  block-on-debt:
    description: "Also block when the debt-delta exceeds the budget. Phase 4."
    required: false
    default: "false"
  block-on-pattern:
    description: >-
      Block when a pattern lane flags something. Comma-separated; each value is
      a lane (slop|security|convention|docs|weakened-tests|all) or a rule id
      (e.g. hardcoded-secret, test-removed). Advisory if empty.
    required: false
    default: ""
  comment:
    description: "Post / update the report as a PR comment."
    required: false
    default: "true"
  comment-inline:
    description: >-
      Also post each surviving mutant as a review comment on its line (GitHub
      only; needs `comment`). Each is commented once; a failed review is
      retried on the next run.
    required: false
    default: "false"
  metrics-file:
    description: "Append a JSON-Lines validation record to this file (Phase 3)."
    required: false
    default: ""
  metrics-url:
    description: >-
      POST the run's telemetry to a Mergestro `/v1/ingest` URL so the hosted fleet
      views (retention, disable-rate, fix-vs-override) see this run. Best-effort and
      time-bounded — a slow or unreachable endpoint logs a warning and never fails the
      gate. Leave empty to skip upload.
    required: false
    default: ""
  metrics-token:
    description: >-
      Bearer token for the Mergestro tenant, sent as `Authorization: Bearer <token>`
      on the metrics-url POST. Pass a secret; it is masked in logs. Required when
      metrics-url points at an authenticated Mergestro instance.
    required: false
    default: ""
  enable-python:
    description: >-
      Install Python + cosmic-ray so changed `.py` files are mutation-tested
      (advisory PoC). Off by default — your project's own test deps (e.g.
      pytest) must already be installed for the Python suite to run.
    required: false
    default: "false"
  python-version:
    description: "Python version for the Python toolchain (when enable-python)."
    required: false
    default: "3.x"
  cosmic-ray-version:
    description: "Pinned cosmic-ray version (when enable-python). Pin to a known-good release for reproducible CI."
    required: false
    default: "8.4.6"
  turnover:
    description: "Run the turnover maintainability-drift lane (copy/paste, duplication, refactor and churn of the PR's commits against the repo's own baseline)."
    required: false
    default: "true"
  turnover-baseline:
    description: >-
      Path of the turnover baseline file. Built from full history on the first run when
      absent (the workflow needs `fetch-depth: 0` for that); commit it or restore it with
      actions/cache so later runs only classify new commits.
    required: false
    default: ".turnover/baseline.json"
  block-on-turnover-drift:
    description: "Fail the job when the PR drifts past the turnover policy (advisory by default)."
    required: false
    default: "false"
  turnover-baseline-url:
    description: >-
      Mergestro plane URL for the turnover baseline service. When set, the baseline is fetched
      from the plane before the run (no cache or full clone needed once one exists) and pushed
      back after `slop-gate baseline`. Authenticated with `metrics-token`.
    required: false
    default: ""
  version:
    description: "Release tag of the prebuilt slop-gate binary to install."
    required: false
    default: "v0.6.0"
  token:
    description: "GitHub token used to post the PR comment."
    required: false
    default: ""
  release-token:
    description: >-
      Token with read access to the action repo's releases, used to fetch the
      prebuilt binary via the authenticated GitHub asset API. Required when the
      action repo is PRIVATE (the default GITHUB_TOKEN of a *different* consumer
      repo cannot read it — supply a PAT or GitHub App token). Leave empty for a
      public action repo. Also used to authenticate the source-build fallback.
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Install cargo-mutants
      shell: bash
      run: |
        set -euo pipefail
        if ! command -v cargo-mutants >/dev/null 2>&1; then
          cargo install cargo-mutants --locked
        fi

    - name: Install cargo-nextest
      if: ${{ inputs.test-tool == 'nextest' }}
      shell: bash
      run: |
        set -euo pipefail
        if ! command -v cargo-nextest >/dev/null 2>&1; then
          cargo install cargo-nextest --locked
        fi

    - name: Install slop-gate
      shell: bash
      env:
        ACTION_REPO: ${{ github.action_repository }}
        VERSION: ${{ inputs.version }}
        # Empty for a public action repo; a read-scoped PAT / App token when the
        # action repo is private. Falls back to the comment token / GITHUB_TOKEN.
        RELEASE_TOKEN: ${{ inputs.release-token != '' && inputs.release-token || (inputs.token != '' && inputs.token || github.token) }}
      run: |
        set -euo pipefail
        DEST="$HOME/.cargo/bin"
        mkdir -p "$DEST"
        echo "$DEST" >> "$GITHUB_PATH"
        if command -v slop-gate >/dev/null 2>&1; then
          echo "slop-gate already installed"; exit 0
        fi

        # Keep the token out of any log line.
        [ -n "${RELEASE_TOKEN}" ] && echo "::add-mask::${RELEASE_TOKEN}"

        TARBALL="slop-gate-x86_64-unknown-linux-musl.tar.gz"
        API="https://api.github.com/repos/${ACTION_REPO}"
        auth=()
        [ -n "${RELEASE_TOKEN}" ] && auth=(-H "Authorization: Bearer ${RELEASE_TOKEN}")

        # Resolve the release by tag via the API. This works for both public and
        # PRIVATE action repos (the public releases/download/ URL 404s on
        # private), and returns the per-asset ids we download below.
        if rel="$(curl -fsSL "${auth[@]}" -H "Accept: application/vnd.github+json" \
                   -H "X-GitHub-Api-Version: 2022-11-28" \
                   "${API}/releases/tags/${VERSION}")"; then
          command -v jq >/dev/null 2>&1 || { echo "::error::jq is required to parse the release API"; exit 1; }
          asset_id="$(printf '%s' "$rel" | jq -r --arg n "$TARBALL"        '.assets[]|select(.name==$n)|.id' | head -n1)"
          sha_id="$(printf '%s' "$rel"   | jq -r --arg n "$TARBALL.sha256" '.assets[]|select(.name==$n)|.id' | head -n1)"
          if [ -n "$asset_id" ] && [ "$asset_id" != "null" ] && [ -n "$sha_id" ] && [ "$sha_id" != "null" ]; then
            # Asset downloads need Accept: application/octet-stream on the asset
            # endpoint (not the browser_download_url, which isn't auth-friendly).
            curl -fsSL "${auth[@]}" -H "Accept: application/octet-stream" "${API}/releases/assets/${asset_id}" -o "/tmp/${TARBALL}"
            curl -fsSL "${auth[@]}" -H "Accept: application/octet-stream" "${API}/releases/assets/${sha_id}"   -o "/tmp/${TARBALL}.sha256"
            # Verify the published checksum before extracting/executing anything.
            ( cd /tmp && sha256sum -c "${TARBALL}.sha256" )
            tar -xzf "/tmp/${TARBALL}" -C "$DEST"
            chmod +x "$DEST/slop-gate"
            echo "installed slop-gate ${VERSION} from release asset"
            exit 0
          fi
          echo "::notice::release ${VERSION} has no musl asset; building from source"
        else
          echo "::notice::release ${VERSION} not found (or unreadable); building from source"
        fi

        # Source-build fallback. For a private action repo the git fetch needs
        # auth too; use an insteadOf rewrite scoped to only ACTION_REPO so the
        # token never reaches cargo's printed URL or unrelated dependencies.
        # The workspace gitignores Cargo.lock, so no --locked.
        if [ -n "${RELEASE_TOKEN}" ]; then
          git config --global url."https://x-access-token:${RELEASE_TOKEN}@github.com/${ACTION_REPO}.git".insteadOf "https://github.com/${ACTION_REPO}.git"
          trap 'git config --global --unset url."https://x-access-token:${RELEASE_TOKEN}@github.com/${ACTION_REPO}.git".insteadOf 2>/dev/null || true' EXIT
        fi
        cargo install --git "https://github.com/${ACTION_REPO}.git" mergestro-gate --bin slop-gate --tag "$VERSION"

    - name: Set up Python (for cosmic-ray mutation of changed .py)
      if: ${{ inputs.enable-python == 'true' }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install cosmic-ray
      if: ${{ inputs.enable-python == 'true' }}
      shell: bash
      run: |
        set -euo pipefail
        python -m pip install --upgrade pip
        python -m pip install "cosmic-ray==${{ inputs.cosmic-ray-version }}"

    - name: Resolve merge-base
      id: base
      shell: bash
      env:
        INPUT_BASE: ${{ inputs.base-ref }}
        PR_BASE: ${{ github.base_ref }}
      run: |
        set -euo pipefail
        BASE="${INPUT_BASE:-$PR_BASE}"
        if [ -z "$BASE" ]; then
          echo "::error::no base ref (set base-ref, or run on pull_request)"; exit 1
        fi
        git fetch --no-tags --depth=2147483647 origin "$BASE" >/dev/null 2>&1 || true
        MB="$(git merge-base "origin/${BASE}" HEAD || git merge-base "$BASE" HEAD)"
        echo "merge_base=$MB" >> "$GITHUB_OUTPUT"
        echo "Diffing against merge-base $MB (of $BASE)"

    - name: Ensure a turnover baseline
      if: ${{ inputs.turnover == 'true' }}
      shell: bash
      env:
        MERGE_BASE: ${{ steps.base.outputs.merge_base }}
        BASELINE_URL: ${{ inputs.turnover-baseline-url }}
        METRICS_TOKEN: ${{ inputs.metrics-token }}
      run: |
        set -euo pipefail
        if [ -n "${METRICS_TOKEN}" ]; then echo "::add-mask::${METRICS_TOKEN}"; fi
        if [ -f "${{ inputs.turnover-baseline }}" ]; then exit 0; fi
        # The plane's baseline service first: a stored file means no walk at all.
        if [ -n "${BASELINE_URL}" ]; then
          mkdir -p "$(dirname "${{ inputs.turnover-baseline }}")"
          if curl -sfS --connect-timeout 10 --max-time 120 -H "Authorization: Bearer ${METRICS_TOKEN}" \
               "${BASELINE_URL%/}/v1/turnover/baseline/${GITHUB_REPOSITORY}" \
               -o "${{ inputs.turnover-baseline }}"; then
            echo "turnover baseline fetched from the plane"; exit 0
          fi
          rm -f "${{ inputs.turnover-baseline }}"
        fi
        if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then
          echo "::warning::no turnover baseline at ${{ inputs.turnover-baseline }} and the checkout is shallow — the lane will be skipped. Use fetch-depth: 0 (or the plane's baseline service / a committed file) to enable it."
          exit 0
        fi
        echo "::notice::building the turnover baseline at ${{ inputs.turnover-baseline }} from full history"
        args=( baseline --repo . --base "$MERGE_BASE" --head HEAD --turnover-baseline "${{ inputs.turnover-baseline }}" )
        [ "${{ inputs.config }}" != "" ] && args+=( --config "${{ inputs.config }}" )
        # With a plane configured the freshly built file is pushed, so the next runner fetches it.
        [ -n "${BASELINE_URL}" ] && args+=( --turnover-baseline-url "${BASELINE_URL}" )
        slop-gate "${args[@]}"

    - name: Run slop gate
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.token != '' && inputs.token || github.token }}
        MERGE_BASE: ${{ steps.base.outputs.merge_base }}
        # The true PR head (GITHUB_SHA is the merge commit) — sharpens the
        # per-PR survivor tracking in the validation telemetry.
        PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        # The PR's author, which GITHUB_ACTOR is not: on a re-run or a merge-train run the
        # actor is whoever/whatever triggered the workflow, often a bot. Mergestro's
        # per-active-developer rollup reads this field. Derived from the event payload so it
        # needs no configuration; empty on non-PR events, which simply omits the field.
        PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        # Read by slop-gate's emitter as the Bearer token for the metrics-url POST.
        METRICS_TOKEN: ${{ inputs.metrics-token }}
      run: |
        set -euo pipefail
        # Keep the ingest token out of any log line. Explicit `if` (not `[ ... ] && echo`) so the
        # empty-token case can never interact with `set -e`.
        if [ -n "${METRICS_TOKEN}" ]; then echo "::add-mask::${METRICS_TOKEN}"; fi
        args=( --repo . --base "$MERGE_BASE" --head HEAD
               --jobs "${{ inputs.jobs }}"
               --timeout "${{ inputs.timeout }}"
               --max-per-function "${{ inputs.max-per-function }}"
               --max-survivors "${{ inputs.max-survivors }}" )
        [ "${{ inputs.config }}" != "" ] && args+=( --config "${{ inputs.config }}" )
        [ "${{ inputs.advisory }}" = "true" ] && args+=( --advisory )
        [ "${{ inputs.block-on-zero-assertion }}" = "true" ] && args+=( --block-on-zero-assertion )
        [ "${{ inputs.block-on-severity }}" != "" ] && args+=( --block-on-severity "${{ inputs.block-on-severity }}" )
        [ "${{ inputs.debt-budget }}" != "" ] && args+=( --debt-budget "${{ inputs.debt-budget }}" )
        [ "${{ inputs.block-on-debt }}" = "true" ] && args+=( --block-on-debt )
        [ "${{ inputs.budget }}" != "" ] && args+=( --budget "${{ inputs.budget }}" )
        [ "${{ inputs.block-on-budget }}" = "true" ] && args+=( --block-on-budget )
        [ "${{ inputs.in-place }}" = "true" ] && args+=( --in-place )
        [ "${{ inputs.test-workspace }}" = "true" ] && args+=( --test-workspace )
        [ "${{ inputs.test-tool }}" != "" ] && args+=( --test-tool "${{ inputs.test-tool }}" )
        [ "${{ inputs.block-on-pattern }}" != "" ] && args+=( --block-on-pattern "${{ inputs.block-on-pattern }}" )
        [ "${{ inputs.turnover }}" != "true" ] && args+=( --no-turnover )
        [ "${{ inputs.turnover }}" = "true" ] && args+=( --turnover-baseline "${{ inputs.turnover-baseline }}" )
        [ "${{ inputs.block-on-turnover-drift }}" = "true" ] && args+=( --block-on-turnover-drift )
        [ "${{ inputs.turnover-baseline-url }}" != "" ] && args+=( --turnover-baseline-url "${{ inputs.turnover-baseline-url }}" )
        [ "${{ inputs.comment }}" = "true" ] && args+=( --comment )
        [ "${{ inputs.comment }}" = "true" ] && [ "${{ inputs.comment-inline }}" = "true" ] && args+=( --comment-inline )
        [ "${{ inputs.metrics-file }}" != "" ] && args+=( --metrics-file "${{ inputs.metrics-file }}" )
        [ "${{ inputs.metrics-url }}" != "" ] && args+=( --metrics-url "${{ inputs.metrics-url }}" )
        # A SARIF file left from an earlier run (a self-hosted runner's workspace,
        # a committed file) must not be uploaded as this run's findings: remove it,
        # so after this step the file exists only if this run wrote it.
        if [ "${{ inputs.sarif }}" != "" ]; then
          rm -f -- "${{ inputs.sarif }}"
          args+=( --sarif "${{ inputs.sarif }}" )
        fi
        slop-gate "${args[@]}"

    # always(): a blocked verdict fails the step above, and that is exactly when
    # the findings matter. hashFiles(): the step above removed any old file, so
    # one exists only if this run wrote it — an operational failure before the
    # report leaves none, and nothing stale is uploaded in its place.
    - name: Upload SARIF to code scanning
      if: ${{ always() && inputs.upload-sarif == 'true' && inputs.sarif != '' && hashFiles(inputs.sarif) != '' }}
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: ${{ inputs.sarif }}
        category: mergestro-gate
