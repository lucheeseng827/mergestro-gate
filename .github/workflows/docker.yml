# Build + push the official multi-arch Mergestro Gate image to Docker Hub
# (docker.io/mancube/mergestro-gate). Active in the public mirror; inert in the
# monorepo (the Dockerfile/Cargo.lock it builds only exist in the mirrored cut).
#
# Requires two repo/environment secrets on the mirror:
#   DOCKERHUB_USERNAME — a Docker Hub user with push access to the mancube org
#   DOCKERHUB_TOKEN    — a Docker Hub access token (Read/Write)
#
# Fires on the same version tags as the binary release, so `v0.1.0` publishes
# both the GitHub release binary and mancube/mergestro-gate:0.1.0 (+ :latest).

name: Publish Docker image

on:
  push:
    tags:
      # The mirror is tagged with the manifest version (e.g. v0.1.0); type=semver
      # parses this. A `slop-gate-v*` pattern would not parse as semver here, so
      # it's intentionally omitted.
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to publish (e.g. 0.1.0)"
        required: true

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  docker:
    runs-on: ubuntu-latest
    # DOCKERHUB_USERNAME / DOCKERHUB_TOKEN live in the 'cicd' environment.
    environment: cicd
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU (arm64 emulation)
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: mancube/mergestro-gate
          # latest=auto → semver tags also tag :latest. Manual dispatch uses the
          # supplied raw tag.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=${{ github.event.inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Build + push (amd64 + arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
