# Build + push the official multi-arch Mergestro Gate image to Docker Hub
# (docker.io/mancube/mergestro-gate). Active in the public mirror; inert in the
# monorepo (the Dockerfile/Cargo.lock it builds only exist in the mirrored cut).
#
# Requires two secrets in the mirror's `cicd` environment:
#   DOCKERHUB_USERNAME — a Docker Hub user with push access to the mancube org
#   DOCKERHUB_TOKEN    — a Docker Hub access token (Read/Write)
#
# Fires automatically on the full-semver version tags the OSS sync stamps
# (`v0.5.0` → mancube/mergestro-gate:0.5.0 + :0.5 + :latest). The moving `v1`
# alias tag deliberately does NOT fire it (tags filter is v*.*.*).
#
# Each architecture builds NATIVELY — amd64 on ubuntu-latest, arm64 on GitHub's
# free-for-public-repos arm runners — then a merge job stitches one multi-arch
# manifest. No QEMU: the old emulated arm64 leg compiled cargo-mutants for
# 20-40 min, which is why releases used to be pushed from a local build.

name: Publish Docker image

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to publish (e.g. 0.5.0)"
        required: true

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    # DOCKERHUB_USERNAME / DOCKERHUB_TOKEN live in the 'cicd' environment.
    environment: cicd
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Push by digest only — the merge job below owns the human-readable tags.
      - name: Build + push (${{ matrix.platform }}, native)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=docker.io/mancube/mergestro-gate,push-by-digest=true,name-canonical=true,push=true
          provenance: false
          cache-from: type=gha,scope=docker-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=docker-${{ matrix.arch }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: build
    runs-on: ubuntu-latest
    environment: cicd
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: mancube/mergestro-gate
          # latest=auto → semver tags also tag :latest. Manual dispatch uses the
          # supplied raw tag.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=${{ github.event.inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Create multi-arch manifest
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf 'docker.io/mancube/mergestro-gate@sha256:%s ' *)

      - name: Inspect published image
        run: docker buildx imagetools inspect "docker.io/mancube/mergestro-gate:${{ steps.meta.outputs.version }}"
