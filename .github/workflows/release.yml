# Release workflow for the PUBLIC mergestro-gate repo.
#
# This file is inert in the monorepo (only repo-root .github/workflows run); it
# becomes active once mirrored to lucheeseng827/mergestro-gate, where it builds
# the static musl `slop-gate` binary the composite action.yml downloads (the
# tarball name must match action.yml's TARBALL). Repo-neutral on purpose: a
# single-crate public repo, so no `-p` and no monorepo paths.
#
# Cut a release: push a tag `v*` (or `slop-gate-v*`).
name: release

on:
  push:
    tags:
      - "v*"
      - "slop-gate-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g. v0.1.0). Must be an existing tag."
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Install musl tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build static binary
        run: cargo build --release --bin slop-gate --target x86_64-unknown-linux-musl

      - name: Package (name must match action.yml's TARBALL)
        run: |
          set -euo pipefail
          TARBALL="slop-gate-x86_64-unknown-linux-musl.tar.gz"
          tar -czf "$TARBALL" -C target/x86_64-unknown-linux-musl/release slop-gate
          sha256sum "$TARBALL" > "$TARBALL.sha256"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          # On a tag push github.ref_name is the tag; on manual dispatch it's the
          # branch, so take the explicit input there (softprops needs a real tag).
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            slop-gate-x86_64-unknown-linux-musl.tar.gz
            slop-gate-x86_64-unknown-linux-musl.tar.gz.sha256
          fail_on_unmatched_files: true
